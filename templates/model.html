<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Team Pleiades Exoplanet Detection ML Model.">
    <title> Pleiades ML Model </title>
    <link rel="icon" href="static/icons/favicon.ico" type="image/icon type">
    <link rel="stylesheet" href="static/css/root.css">
    <link rel="stylesheet" href="static/css/base.css">
    <link rel="stylesheet" href="static/css/navbar.css">
    <link rel="stylesheet" href="static/css/model.css">
</head>
<body>
    <div id="navbar" class="topnav">
        <img src="static/icons/favicon.png" id="teamLogo">
        <!-- <a href="adv" id="adv">Advanced Model</a> -->
        <a href="model" id="model" class="curr">Model</a>
        <a href="/" id="home">Home</a>
        
        <a href="javascript:void(0);" id="menuContainer" class="icon">☰</a>
    </div>
    <hr>

    <button onclick="displayPopup()" id="openSettings"><box-icon name="cog" class="icon"></box-icon></button>
    

<div id="popUp" class="modal">
  <form class="modal-content animate" method="post">
        <div class="container">
            <h2><b>Settings</b></h2>

            <label for="tree_method"><b>Tree Method</b></label>
            <input type="text" placeholder="Enter tree method" name="tree_method">


            <label for="max_depth"><b>Maximum Depth</b></label>
            <input type="number" step=1 placeholder="Enter maximum depth" name="max_depth">

            <label for="max_delta_step"><b>Max Delta Step</b></label>
            <input type="number" step=1 placeholder="Enter max delta step" name="max_delta_step">

            <label for="learning_rate"><b>Learning Rate</b></label>
            <input type="number" step=0.01 placeholder="Enter learning rate" name="learning_rate">

            <label for="alpha"><b>Alpha (α)</b></label>
            <input type="number" step=0.01 placeholder="Enter alpha" name="alpha">

            <label for="lambda"><b>Lambda (λ)</b></label>
            <input type="number" step=0.01 placeholder="Enter lambda" name="lambda">

            <label for="gamma"><b>Gamma (γ)</b></label>
            <input type="number" step=0.01 placeholder="Enter gamma" name>
            
            <label for="subsample"><b> Subsample</b></label>
            <input type="number" step=0.01 placeholder="Enter subsample" name="subsample">

            <label for="colsample_bytree"><b> Percentage of Columns per Tree </b></label>
            <input type="text" step=0.1 placeholder="Enter column percentage by tree" name="colsample_bytree">

            <label for="min_child_weight"><b>Minimum Child Weight</b></label>
            <input type="number" step="1" placeholder="Enter minimum child weight" name="min_child_weight">

            <label for="n_estimators"><b>Number of Estimators</b></label>
            <input type="number" placeholder="Enter number of estimators" name="n_estimators">



            <button type="submit"> Save Settings</button>
            <button type="button" onclick="closePopup()" id="cancelButton">Cancel</button>
        </div>
  </form>
</div>
    
<script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
<script src="static/js/formTemplate.js"></script>
</body>
</html>
